name: Normalize CSV

# 觸發時機：每次 push 到 main 且 rankings.csv 有變動時
on:
  push:
    branches: [main]
    paths:
      - 'rankings.csv'

permissions:
  contents: write  # 讓 workflow 能 push 回 repo

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Normalize rankings.csv
        run: python3 scraper/normalize.py

      - name: Commit if changed
        # GitHub Actions 用 GITHUB_TOKEN 推回去「不會」觸發新一輪 workflow（避免無限迴圈）
        run: |
          if git diff --quiet rankings.csv; then
            echo "CSV 已經是正規化狀態，無需 commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rankings.csv
            git commit -m "chore: 自動正規化 rankings.csv（補時間前導零 + BOM）"
            git push
            echo "✓ 已自動 push 正規化後的 CSV"
          fi
